name: Slow stores

# stores whose bot protection only allows a few requests at a time: a few
# sections every hour on a data/<store>-<day> branch, folded into a single
# commit on main the next day (see slow.py and scripts/slow_store.sh)
on:
  schedule:
    - cron: '7 * * * *'
  workflow_dispatch:

# runs push to the same branches
concurrency:
  group: slow-stores
  cancel-in-progress: false

permissions:
  contents: write

env:
  GIT_AUTHOR_NAME: CI
  GIT_AUTHOR_EMAIL: ci@github.com
  GIT_COMMITTER_NAME: CI
  GIT_COMMITTER_EMAIL: ci@github.com

jobs:
  scrape:
    # github runner IPs are blocked by these stores
    runs-on: [self-hosted, Linux, X64]
    strategy:
      fail-fast: false
      matrix:
        store: [xalkiadakis]

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main
          filter: blob:none
          sparse-checkout: |
            .github
            pending
            scripts
          sparse-checkout-cone-mode: true

      - name: Setup python
        # a venv kept on the runner; actions/setup-python only supports
        # some distributions on self-hosted runners
        run: |
          venv="$HOME/.cache/ekatanalotis/venv"
          [ -x "$venv/bin/python" ] || python3 -m venv "$venv"
          "$venv/bin/pip" install -q -r requirements.txt
          echo "$venv/bin" >> "$GITHUB_PATH"
          "$venv/bin/python" --version

      - name: Scrape
        run: bash scripts/slow_store.sh ${{ matrix.store }}
