name: Schedule

on:
  schedule:
    - cron: '12 10 * * *'
  workflow_dispatch:

env:
  GIT_AUTHOR_NAME: CI
  GIT_AUTHOR_EMAIL: ci@github.com
  GIT_COMMITTER_NAME: CI
  GIT_COMMITTER_EMAIL: ci@github.com

jobs:
  hosted:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main
          # smdata/ is ~3GB; only fetch blobs on demand and leave it out of
          # the working tree. New files are added with `git add --sparse`.
          filter: blob:none
          sparse-checkout: |
            .github
            scripts
          sparse-checkout-cone-mode: true

      - name: Setup python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Generate files
        # sklavenitis blocks github runner IPs, see the self-hosted job
        run: python -u ./sm.py --exclude sklavenitis

      - name: commit csv files to main
        # commit whatever stores succeeded, even when another one failed
        if: success() || failure()
        run: bash scripts/commit_push.sh "Update csv files" smdata/

  self-hosted:
    runs-on: [self-hosted, Linux, X64]

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main
          filter: blob:none
          sparse-checkout: |
            .github
            scripts
          sparse-checkout-cone-mode: true

      - name: Setup python
        # a venv kept on the runner; actions/setup-python only supports
        # some distributions on self-hosted runners
        run: |
          venv="$HOME/.cache/ekatanalotis/venv"
          [ -x "$venv/bin/python" ] || python3 -m venv "$venv"
          "$venv/bin/pip" install -q -r requirements.txt
          echo "$venv/bin" >> "$GITHUB_PATH"
          "$venv/bin/python" --version

      - name: Generate files
        run: python -u ./sm.py sklavenitis

      - name: commit csv files to main
        if: success() || failure()
        run: bash scripts/commit_push.sh "Update sklavenitis csv" smdata/
